<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>middleshoooot by more · 图片编辑</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="editor.css">
<body class="result-page"><header class="editor-header"><div class="brand">middleshoooot by more<em>截图之后，再留一点自己的表达。</em></div><div class="actions"><label><input id="sides" type="checkbox">保留两侧首屏</label><button id="download" disabled>保存全部 PNG</button><button id="delete" class="secondary">清除本次截图</button></div></header>
<main class="result-main"><p id="info" class="summary" role="status">正在本机拼接…</p>
<section id="editor" hidden aria-label="截图编辑器">
<div class="editor-topline"><div><span class="eyebrow">LOCAL IMAGE STUDIO</span><h1>把重点，留下来。</h1></div><span id="dimensions" class="dimensions"></span></div>
<div class="toolbar" role="toolbar" aria-label="编辑工具">
<div class="tool-group" id="tools"><button data-tool="pan" class="tool selected" aria-pressed="true" title="浏览图片">浏览</button><button data-tool="crop" class="tool" aria-pressed="false">裁剪</button><button data-tool="arrow" class="tool" aria-pressed="false">箭头</button><button data-tool="rect" class="tool" aria-pressed="false">方框</button><button data-tool="pen" class="tool" aria-pressed="false">画笔</button><button data-tool="text" class="tool" aria-pressed="false">文字</button><button data-tool="redact" class="tool" aria-pressed="false" title="用不透明黑块遮挡敏感信息">遮挡</button></div>
<div class="tool-group settings"><label>颜色<input id="ink" type="color" value="#c8573e" aria-label="标注颜色"></label><label>线宽<select id="stroke" aria-label="线宽"><option value="3">细</option><option value="6" selected>中</option><option value="12">粗</option></select></label><label>字号<select id="fontSize" aria-label="文字大小"><option>18</option><option selected>28</option><option>40</option><option>56</option><option>72</option></select></label><input id="textValue" maxlength="240" placeholder="输入文字后，在图上点击放置" aria-label="标注文字"></div>
<div class="tool-group history"><button id="undo" class="tool" disabled title="⌘/Ctrl+Z">撤销</button><button id="redo" class="tool" disabled title="⌘/Ctrl+Shift+Z">重做</button><button id="reset" class="tool">还原本段</button></div>
</div>
<div class="editor-controls"><label id="partLabel">图片分段<select id="part" aria-label="选择图片分段"></select></label><div id="cropActions" hidden><button id="applyCrop">应用裁剪</button><button id="cancelCrop" class="secondary">取消</button></div><label>显示比例<select id="zoom" aria-label="显示比例"><option value="fit">适合宽度</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><button id="downloadPart" class="secondary">保存本段 PNG</button></div>
<p id="editorHint" class="editor-hint" role="status">选择工具即可编辑，标注与裁剪按原始像素导出。</p>
<div id="workspace" class="image-workspace"><div id="stage" class="image-stage"><svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-label="在图片上拖动或点击以编辑"></svg></div></div>
<footer class="editor-note">仅在本机处理，不上传图片。编辑仅在当前页面保留，刷新会恢复原图，请及时保存。遮挡导出为实心黑块，原截图仍保存在本机，使用后可清除。</footer>
</section><div id="previews" hidden></div></main>
<dialog id="layoutDialog"><h2>重新拼接图片？</h2><p>切换边栏布局会清空当前所有分段的编辑。已下载的图片不受影响。</p><div class="dialog-actions"><button id="cancelLayout" class="secondary">保留编辑</button><button id="confirmLayout">重新拼接</button></div></dialog>
<script src="db.js"></script><script src="stitch.js"></script><script src="editor.js"></script><script src="result.js"></script></body></html>
