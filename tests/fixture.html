<!doctype html><meta charset="utf-8"><title>Middle 测试 · 三栏聊天</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.6 sans-serif;color:#223d34;background:#f6f4ed;display:grid;grid-template-columns:210px 1fr 240px;height:100vh}.left,.right{padding:30px;background:#dce6d8}.right{background:#e8dfcc}.center{overflow-y:auto;scroll-behavior:smooth;height:100vh;padding:20px 30px}.msg{margin:20px 0;padding:20px;background:white;border-radius:12px;border-left:4px solid #468166}.msg img{display:block;width:100%;max-width:600px}</style><aside class="left"><h2>Middle</h2><p>固定左边栏</p><p>LOCAL ONLY</p></aside><main class="center"></main><aside class="right"><h3>固定右边栏</h3><p>不会随中间滚动</p></aside><script>document.querySelector('main').innerHTML=Array.from({length:18},(_,i)=>`<section class="msg" data-n="${i}"><h2>聊天记录 ${i+1}</h2><p>这一段应该只出现一次。文字、代码、图片都来自真实页面截图。</p>${i%4===2?'<img src="data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220"><rect width="600" height="220" fill="#aec5aa"/><circle cx="300" cy="110" r="70" fill="#496d54"/><text x="300" y="120" text-anchor="middle" fill="white" font-size="26">IMAGE '+i+'</text></svg>')+'">':''}<p>消息底部 / ${i+1}</p></section>`).join('')</script>
<style>.composer{position:fixed;bottom:0;left:210px;right:240px;height:80px;background:rgb(255,0,170);z-index:50;padding:10px}.composer textarea{height:52px;width:100%;background:rgb(255,0,170);border:0}.jump{position:fixed;bottom:120px;left:500px;background:rgb(0,255,0);color:black;border:0;padding:8px;z-index:51}.center{padding-bottom:110px}</style><form class="composer"><textarea placeholder="Message">INPUT BOX MUST NOT REPEAT</textarea></form><button class="jump">7 messages</button><style>.noise{background:rgb(0,0,255);color:white;border:0;border-radius:20px;padding:4px 12px;font:12px sans-serif;display:table;margin:4px auto;cursor:pointer} .literal{padding:4px}</style><script>
for(const [i,el] of [...document.querySelectorAll('.msg')].entries()){
 el.insertAdjacentHTML('beforeend', '<button class="noise">'+(i%2?2:3)+' messages</button><div role="button" tabindex="0" class="noise">See more</div><p class="literal">聊天正文保留：3 messages 是一个例子。</p>');
}
</script>
